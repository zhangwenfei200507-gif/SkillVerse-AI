name: Windows release certification

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Same private repository run containing the verified Phase 19 installers
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  lifecycle:
    if: ${{ github.event.repository.private && github.ref_name == github.event.repository.default_branch }}
    runs-on: windows-2025
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        scenario: [Clean, Upgrade]
    steps:
      - name: Validate source run ID
        shell: pwsh
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          if ($env:CANDIDATE_RUN_ID -notmatch '^[1-9][0-9]{0,19}$') {
            throw 'Expected a numeric Actions run ID.'
          }
      - name: Checkout reviewed test scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download candidates from this private repository
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: skillverse-phase19-installers
          path: ${{ runner.temp }}/phase19-installers
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.candidate_run_id }}
      - name: Run the installed Windows application lifecycle
        shell: pwsh
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          ./app/scripts/phase19-windows-lifecycle.ps1 -Scenario $env:SCENARIO -Environment HostedRunner `
            -Installers (Join-Path $env:RUNNER_TEMP 'phase19-installers') `
            -Evidence (Join-Path $env:RUNNER_TEMP 'phase19-evidence') -ExerciseRecovery
      - name: Save the redacted lifecycle receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase19-windows-${{ matrix.scenario }}
          path: ${{ runner.temp }}/phase19-evidence/lifecycle.json
          if-no-files-found: warn
          retention-days: 7
